<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manzana Amarilla con Salsa</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #fff4a8;
        }

        h1 {
            margin-top: 30px;
            color: #d99b00;
        }

        #puntos {
            font-size: 28px;
            font-weight: bold;
            margin: 20px;
        }

        /* La imagen de la manzana */
        #manzana {
            width: 250px;
            cursor: pointer;
            user-select: none;

            /* Animación suave */
            transition: transform 0.15s;
        }

        /* Animación mientras haces clic */
        #manzana:active {
            transform: scale(0.75) rotate(15deg);
        }

        #historia {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 15px;
        }
    </style>
</head>

<body>

    <h1>🍎 Manzana Amarilla con Salsa</h1>

    <div id="puntos">
        Puntos: <span id="contador">0</span>
    </div>

    <!-- AQUÍ APARECE TU IMAGEN -->
    <img
        id="manzana"
        src="manzana.png"
        alt="Manzana amarilla"
        onclick="darPunto()"
    >

    <div id="historia">
        <h2>📖 La historia</h2>

        <p>
            Una manzana con piernas vuela, hace volteretas y usa rayos X
            mientras busca aventuras entre las nubes.
        </p>
    </div>

    <script>
        let puntos = 0;

        function darPunto() {
            puntos++;

            document.getElementById("contador").textContent = puntos;
        }
    </script>

</body>
</html>
